<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#282c34"/>
      <stop offset="1" stop-color="#1b1d23"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa4f4"/>
      <stop offset="1" stop-color="#3d7fce"/>
    </linearGradient>
  </defs>

  <!-- Rounded badge background -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)" stroke="#11131a" stroke-width="4"/>

  <!-- Database cylinder (lower third): stacked disks -->
  <g stroke="#243a5c" stroke-width="2">
    <path d="M40 76 V104 a24 8 0 0 0 48 0 V76 z" fill="url(#cyl)"/>
    <ellipse cx="64" cy="90" rx="24" ry="8" fill="none" stroke="#243a5c" stroke-width="2" opacity="0.6"/>
    <ellipse cx="64" cy="76" rx="24" ry="8" fill="#6aaef6"/>
  </g>

  <!-- Debris shards breaking off the top, scattering up/out -->
  <g stroke="#11131a" stroke-width="1.5" stroke-linejoin="round">
    <polygon points="60,58 72,52 70,42 58,48" fill="#7fb86b"/>
    <polygon points="80,50 92,48 90,38 79,41" fill="#5aa4f4"/>
    <polygon points="44,50 55,44 52,35 41,40" fill="#5aa4f4"/>
    <polygon points="66,38 76,32 71,24 62,29" fill="#7fb86b"/>
    <polygon points="50,34 58,29 55,22 47,26" fill="#8fbef8"/>
  </g>
</svg>
